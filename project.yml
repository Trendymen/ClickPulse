name: ClickPulse
options:
  bundleIdPrefix: com.liuzhuo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.0.0"
targets:
  ClickPulse:
    type: application
    platform: macOS
    sources:
      - ClickPulse
    info:
      path: ClickPulse/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: ClickPulse
    entitlements:
      path: ClickPulse/ClickPulse.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liuzhuo.clickpulse
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: GRDB
        product: GRDB
  ClickPulseTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ClickPulseTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
    dependencies:
      - target: ClickPulse
schemes:
  ClickPulse:
    build:
      targets:
        ClickPulse: all
        ClickPulseTests: [test]
    test:
      targets:
        - ClickPulseTests
